spring:
  application:
    name: account-service
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  r2dbc:
    url: ${ACCOUNT_R2DBC_URL:r2dbc:postgresql://localhost:5432/account_db}
    username: ${ACCOUNT_DB_USERNAME:banking}
    password: ${ACCOUNT_DB_PASSWORD}
  sql:
    init:
      mode: always
account:
  opening-minimum:
    savings: ${ACCOUNT_SAVINGS_MINIMUM_OPENING:0}
    checking: ${ACCOUNT_CHECKING_MINIMUM_OPENING:0}
    fixed-term: ${ACCOUNT_FIXED_TERM_MINIMUM_OPENING:0}
  free-movements:
    checking: ${ACCOUNT_CHECKING_FREE_MOVEMENTS:0}
  excess-fee:
    savings: ${ACCOUNT_SAVINGS_EXCESS_FEE:0}
    checking: ${ACCOUNT_CHECKING_EXCESS_FEE:0}
  pagination:
    default-page: ${ACCOUNT_DEFAULT_PAGE:0}
    default-size: ${ACCOUNT_DEFAULT_PAGE_SIZE:20}
    max-size: ${ACCOUNT_MAX_PAGE_SIZE:100}
  services:
    customer-url: ${CUSTOMER_SERVICE_URL:http://localhost:8081}
    credit-url: ${CREDIT_SERVICE_URL:http://localhost:8083}
    transaction-url: ${TRANSACTION_SERVICE_URL:http://localhost:8084}
    transaction-timeout-ms: ${ACCOUNT_TRANSACTION_TIMEOUT_MS:2000}
server:
  port: ${ACCOUNT_SERVICE_PORT:8082}
logging:
  level:
    com.pivot.banking.account: INFO

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

resilience4j:
  timelimiter:
    configs:
      default:
        timeout-duration: 2s
