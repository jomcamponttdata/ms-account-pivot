openapi: 3.0.3
info:
  title: ms-acount API
  version: 1.0.0
  description: |
    Bank accounts (savings, checking, fixed term), deposits, withdrawals and balance.
    
    Conventions:
    - Amounts are decimals with two fraction digits (`multipleOf: 0.01`) plus an ISO 4217 `currency`.
      Generators must map them to BigDecimal, never to floating point.
    - List endpoints can be consumed as `application/json` (array) or `application/x-ndjson` (reactive stream).
    - Errors follow RFC 7807 (`application/problem+json`): 400 validation, 404 not found,
      409 concurrent modification, 422 business rule violated, 503 downstream failure.
    - Part I has no authentication (JWT is added in Part III).
    
    Database: PostgreSQL (R2DBC). Depends on ms-customer and ms-transaction.
servers:
  - url: http://localhost:8082
    description: ms-acount (local)

tags:
  - name: Accounts
    description: ms-acount (passive products)

paths:
  /api/v1/accounts:
    get:
      tags: [Accounts]
      operationId: findAllAccounts
      summary: List bank accounts (paginated)
      parameters:
        - name: customerId
          in: query
          required: false
          description: Only accounts where this customer is a holder
          schema:
            type: string
            format: uuid
        - name: accountType
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/AccountType'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Accounts found
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Account'
            application/x-ndjson:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      tags: [Accounts]
      operationId: createAccount
      summary: Open a bank account
      description: |
        Opening rules (Strategy by customer type). All holders must exist and be ACTIVE customers.
        - PERSONAL customer: max one SAVINGS, max one CHECKING, any number of FIXED_TERM; exactly one holder.
        - BUSINESS customer: no SAVINGS or FIXED_TERM; any number of CHECKING;
          one or more holders and zero or more authorized signers.

        Accounts open with a zero balance unless the optional `openingAmount` is supplied.
        When omitted it defaults to zero; when supplied it must be at least the configured
        minimum for the account product (default zero for every product). Its currency is
        the account `currency` field, which defaults to PEN.

        SAVINGS also accepts an optional `minimumDailyAverage`: a customer-defined minimum
        daily-average balance for VIP personal savings. It defaults to zero when omitted,
        must be nonnegative, and uses the account `currency`. Monthly verification is not
        implemented yet: it requires a daily balance history that the account model does not
        keep, so the value is stored but no rule is enforced against it.
        Conditional fields by account type:
        - SAVINGS requires `maxMonthlyMovements`.
        - CHECKING requires `maintenanceFee`.
        - FIXED_TERM requires `allowedMovementDay`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountCreateRequest'
            examples:
              savings:
                summary: Personal savings account
                value:
                  accountType: SAVINGS
                  holders:
                    - 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  currency: PEN
                  maxMonthlyMovements: 20
                  minimumDailyAverage: 0.00
              checking:
                summary: Business checking account
                value:
                  accountType: CHECKING
                  holders:
                    - 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  currency: PEN
                  maintenanceFee:
                    amount: 10.00
                    currency: PEN
              fixedTerm:
                summary: Personal fixed-term account
                value:
                  accountType: FIXED_TERM
                  holders:
                    - 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  currency: PEN
                  allowedMovementDay: 15
      responses:
        '201':
          description: Account opened
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/BusinessRuleViolation'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/accounts/{accountId}:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    get:
      tags: [Accounts]
      operationId: findAccountById
      summary: Get an account by id
      responses:
        '200':
          description: Account found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Accounts]
      operationId: updateAccount
      summary: Update an account
      description: The account type and the balance cannot be changed through this endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountUpdateRequest'
      responses:
        '200':
          description: Account updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/BusinessRuleViolation'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      tags: [Accounts]
      operationId: deleteAccount
      summary: Delete an account
      responses:
        '204':
          description: Account deleted
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/accounts/{accountId}/balance:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    get:
      tags: [Accounts]
      operationId: getAccountBalance
      summary: Get the available balance of an account
      responses:
        '200':
          description: Balance found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Balance'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/accounts/{accountId}/deposits:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    post:
      tags: [Accounts]
      operationId: depositToAccount
      summary: Deposit money into an account
      description: |
        Operation rules (Strategy by account type):
        - SAVINGS: monthly movement limit.
        - CHECKING: no movement limit.
        - FIXED_TERM: one movement per month, only on `allowedMovementDay`.

        The movement is registered in ms-transaction. If registration definitively fails,
        ms-acount attempts to compensate its balance update and returns 503. A timeout
        has an ambiguous outcome because the movement may already have been persisted; it requires
        reconciliation and must not be treated as proof that registration failed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperationRequest'
      responses:
        '201':
          description: Deposit registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MovementReceipt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/BusinessRuleViolation'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/accounts/{accountId}/withdrawals:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    post:
      tags: [Accounts]
      operationId: withdrawFromAccount
      summary: Withdraw money from an account
      description: Same operation rules as deposits, plus sufficient balance.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperationRequest'
      responses:
        '201':
          description: Withdrawal registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MovementReceipt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/BusinessRuleViolation'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/accounts/transfers:
    post:
      tags: [Accounts]
      operationId: transferBetweenAccounts
      summary: Transfer money between two accounts of the same bank
      description: |
        Moves money from `sourceAccountId` to `destinationAccountId` as two movements
        (WITHDRAWAL then DEPOSIT) that share one correlation id. Both accounts live in
        ms-acount, so they may belong to the same customer or to different customers;
        shared holders are not required. Both accounts must exist, be distinct, and use
        the same currency as `amount`. The source balance must cover the amount plus any
        excess-movement fee. Each side's excess fee is charged to its own balance and noted
        in that side's downstream description.

        Both balance updates are persisted in one local PostgreSQL transaction before the
        movements are registered in ms-transaction. A confirmed downstream failure restores
        both balances in one transaction. An ambiguous failure (timeout or circuit breaker)
        does not compensate: the 503 detail carries the correlation id so the transfer can be
        reconciled against ms-transaction.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferRequest'
            examples:
              sameCustomer:
                summary: Transfer between two accounts of one customer
                value:
                  sourceAccountId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  destinationAccountId: 1a2b3c4d-5e6f-4789-8abc-0123456789de
                  amount: 125.50
                  currency: PEN
                  description: Savings top-up
              thirdParty:
                summary: Transfer to an account held by another customer of the same bank
                value:
                  sourceAccountId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  destinationAccountId: 9f8e7d6c-5b4a-4321-9876-fedcba987654
                  amount: 40.00
                  currency: PEN
                  description: Rent payment
      responses:
        '201':
          description: Transfer registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferReceipt'
              example:
                withdrawal:
                  movementId: movement-101
                  movementType: WITHDRAWAL
                  amount: 125.50
                  currency: PEN
                  createdAt: '2026-01-05T10:15:30Z'
                deposit:
                  movementId: movement-102
                  movementType: DEPOSIT
                  amount: 125.50
                  currency: PEN
                  createdAt: '2026-01-05T10:15:31Z'
                correlationId: transfer-request-123
        '400':
          description: Invalid request (validation errors)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: about:blank
                title: Invalid request
                status: 400
                detail: 'amount: must be greater than or equal to 0.01'
        '404':
          description: Resource not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: about:blank
                title: Resource not found
                status: 404
                detail: 'Account not found: 3fa85f64-5717-4562-b3fc-2c963f66afa6'
        '422':
          description: A business rule was violated
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: about:blank
                title: Business rule violated
                status: 422
                detail: Transfer currency must match both account currencies
        '503':
          description: |
            A dependent service failed. A confirmed failure triggers an attempt at local
            compensation; an ambiguous failure carries the correlation id so the transfer
            can be reconciled.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: about:blank
                title: Dependent service unavailable
                status: 503
                detail: 'Movement registration outcome is ambiguous; correlationId=transfer-request-123'

components:
  parameters:
    AccountId:
      name: accountId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      required: false
      description: Zero-based page index. Results are ordered by createdAt and id, so pages are stable.
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      required: false
      description: Page size.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    BadRequest:
      description: Invalid request (validation errors)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Duplicate resource or concurrent modification (retry the request)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    BusinessRuleViolation:
      description: A business rule was violated
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServiceUnavailable:
      description: |
        A dependent service failed. A confirmed failure triggers an attempt at local compensation;
        if compensation conflicts with a concurrent update, or the movement call times out, the final
        outcome is ambiguous and requires reconciliation.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    AccountType:
      type: string
      enum: [SAVINGS, CHECKING, FIXED_TERM]
      description: SAVINGS = ahorro, CHECKING = cuenta corriente, FIXED_TERM = plazo fijo
    AuthorizedSigner:
      type: object
      required: [fullName, documentType, documentNumber]
      properties:
        fullName:
          type: string
          example: Carlos Ruiz
        documentType:
          type: string
          enum: [DNI, CEX, PASSPORT, RUC]
        documentNumber:
          type: string
          example: '45678912'
    AccountCreateRequest:
      oneOf:
        - $ref: '#/components/schemas/SavingsAccountCreateRequest'
        - $ref: '#/components/schemas/CheckingAccountCreateRequest'
        - $ref: '#/components/schemas/FixedTermAccountCreateRequest'
      discriminator:
        propertyName: accountType
        mapping:
          SAVINGS: '#/components/schemas/SavingsAccountCreateRequest'
          CHECKING: '#/components/schemas/CheckingAccountCreateRequest'
          FIXED_TERM: '#/components/schemas/FixedTermAccountCreateRequest'
    SavingsAccountCreateRequest:
      type: object
      required: [accountType, holders, maxMonthlyMovements]
      additionalProperties: false
      properties:
        accountType:
          type: string
          enum: [SAVINGS]
        holders:
          type: array
          minItems: 1
          description: Customer ids of all account holders
          items:
            type: string
            format: uuid
        currency:
          $ref: '#/components/schemas/Currency'
        openingAmount:
          $ref: '#/components/schemas/Amount'
          description: >-
            Optional initial balance. Defaults to zero when omitted and must be at least
            the configured minimum for this product. The currency is the account `currency`.
        minimumDailyAverage:
          $ref: '#/components/schemas/Amount'
          description: >-
            Optional customer-defined minimum daily-average balance for VIP personal savings.
            Defaults to zero when omitted and must be nonnegative. The currency is the account
            `currency`. Monthly verification is not implemented yet: it requires a daily balance
            history that the account model does not keep, so the value is only stored, not enforced.
        maxMonthlyMovements:
          type: integer
          minimum: 1
          example: 20
    CheckingAccountCreateRequest:
      type: object
      required: [accountType, holders, maintenanceFee]
      additionalProperties: false
      properties:
        accountType:
          type: string
          enum: [CHECKING]
        holders:
          type: array
          minItems: 1
          description: Customer ids of all account holders
          items:
            type: string
            format: uuid
        authorizedSigners:
          type: array
          description: Only for business account holders
          items:
            $ref: '#/components/schemas/AuthorizedSigner'
        currency:
          $ref: '#/components/schemas/Currency'
        openingAmount:
          $ref: '#/components/schemas/Amount'
          description: >-
            Optional initial balance. Defaults to zero when omitted and must be at least
            the configured minimum for this product. The currency is the account `currency`.
        maintenanceFee:
          $ref: '#/components/schemas/Amount'
    FixedTermAccountCreateRequest:
      type: object
      required: [accountType, holders, allowedMovementDay]
      additionalProperties: false
      properties:
        accountType:
          type: string
          enum: [FIXED_TERM]
        holders:
          type: array
          minItems: 1
          description: Customer ids of all account holders
          items:
            type: string
            format: uuid
        currency:
          $ref: '#/components/schemas/Currency'
        openingAmount:
          $ref: '#/components/schemas/Amount'
          description: >-
            Optional initial balance. Defaults to zero when omitted and must be at least
            the configured minimum for this product. The currency is the account `currency`.
        allowedMovementDay:
          type: integer
          minimum: 1
          maximum: 31
          description: The only day of the month with movements
          example: 15
    AccountUpdateRequest:
      type: object
      description: Account type and balance are not updatable. Conditional fields are validated against the existing account type.
      properties:
        holders:
          type: array
          minItems: 1
          items:
            type: string
            format: uuid
        authorizedSigners:
          type: array
          items:
            $ref: '#/components/schemas/AuthorizedSigner'
        maintenanceFee:
          $ref: '#/components/schemas/Amount'
          description: Required for CHECKING
        maxMonthlyMovements:
          type: integer
          minimum: 1
          description: Required for SAVINGS
          example: 20
        allowedMovementDay:
          type: integer
          minimum: 1
          maximum: 31
          description: Required for FIXED_TERM (the only day of the month with movements)
          example: 15
    Account:
      type: object
      required: [id, accountNumber, accountType, balance, currency, holders, createdAt]
      properties:
        id:
          type: string
          format: uuid
        accountNumber:
          type: string
          example: '19100012345678'
        accountType:
          $ref: '#/components/schemas/AccountType'
        balance:
          $ref: '#/components/schemas/Amount'
        currency:
          $ref: '#/components/schemas/Currency'
        holders:
          type: array
          items:
            type: string
            format: uuid
        authorizedSigners:
          type: array
          items:
            $ref: '#/components/schemas/AuthorizedSigner'
        maintenanceFee:
          $ref: '#/components/schemas/Amount'
        maxMonthlyMovements:
          type: integer
        allowedMovementDay:
          type: integer
        movementsInCurrentMonth:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
    Currency:
      type: string
      pattern: '^[A-Z]{3}$'
      description: ISO 4217 currency code
      default: PEN
      example: PEN
    Amount:
      type: number
      minimum: 0
      multipleOf: 0.01
      description: Decimal amount with two fraction digits (BigDecimal, not floating point)
      example: 1250.50
    PositiveAmount:
      type: number
      minimum: 0.01
      multipleOf: 0.01
      description: Strictly positive decimal amount with two fraction digits
      example: 100.00
    OperationRequest:
      type: object
      required: [amount]
      properties:
        amount:
          $ref: '#/components/schemas/PositiveAmount'
        currency:
          $ref: '#/components/schemas/Currency'
        description:
          type: string
          maxLength: 200
          example: Salary deposit
    MovementReceipt:
      type: object
      required: [movementId, movementType, amount, currency, createdAt]
      properties:
        movementId:
          type: string
          description: Id of the movement registered in ms-transaction
        movementType:
          type: string
          enum: [DEPOSIT, WITHDRAWAL, PAYMENT, CHARGE]
        amount:
          $ref: '#/components/schemas/PositiveAmount'
        currency:
          $ref: '#/components/schemas/Currency'
        createdAt:
          type: string
          format: date-time
    TransferRequest:
      type: object
      required: [sourceAccountId, destinationAccountId, amount]
      additionalProperties: false
      properties:
        sourceAccountId:
          type: string
          format: uuid
          description: Account debited by the transfer
        destinationAccountId:
          type: string
          format: uuid
          description: Account credited by the transfer
        amount:
          $ref: '#/components/schemas/PositiveAmount'
        currency:
          $ref: '#/components/schemas/Currency'
        description:
          type: string
          maxLength: 200
          example: Rent payment
    TransferReceipt:
      type: object
      required: [withdrawal, deposit, correlationId]
      properties:
        withdrawal:
          $ref: '#/components/schemas/MovementReceipt'
        deposit:
          $ref: '#/components/schemas/MovementReceipt'
        correlationId:
          type: string
          description: Shared correlation id used for both downstream movements
          example: transfer-request-123
    Balance:
      type: object
      required: [productId, productType, balance, currency]
      properties:
        productId:
          type: string
          format: uuid
        productType:
          type: string
          enum: [BANK_ACCOUNT, CREDIT, CREDIT_CARD]
        balance:
          $ref: '#/components/schemas/Amount'
        currency:
          $ref: '#/components/schemas/Currency'
    Problem:
      type: object
      description: RFC 7807 problem details
      required: [status, title]
      properties:
        type:
          type: string
          format: uri-reference
          example: about:blank
        title:
          type: string
          example: Business rule violated
        status:
          type: integer
          example: 422
        detail:
          type: string
        instance:
          type: string
        timestamp:
          type: string
          format: date-time
        errors:
          type: array
          description: Field-level validation errors (400)
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
